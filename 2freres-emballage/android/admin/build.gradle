plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deuxfreres.emballage.admin'
    compileSdk 34

    defaultConfig {
        applicationId "com.deuxfreres.emballage.admin"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "2.0"
    }

    // Même clé que l'application client (enregistrée dans Firebase/Google pour la connexion Google)
    signingConfigs {
        shared {
            storeFile file('../keystore/2freres.jks')
            storePassword '2freres-emballage'
            keyAlias '2freres'
            keyPassword '2freres-emballage'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // Connexion Google (sans mot de passe)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
