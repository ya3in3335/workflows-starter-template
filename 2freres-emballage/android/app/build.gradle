plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deuxfreres.emballage'
    compileSdk 34

    defaultConfig {
        applicationId "com.deuxfreres.emballage"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "3.0"
    }

    // Clé fixe : toutes les versions (GitHub Actions ou locales) ont la même signature,
    // sinon Android refuse d'installer la mise à jour par-dessus l'ancienne version.
    signingConfigs {
        shared {
            storeFile file('../keystore/2freres.jks')
            storePassword '2freres-emballage'
            keyAlias '2freres'
            keyPassword '2freres-emballage'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.work:work-runtime:2.9.1'
}
